# A tag v<version> (v0.2.0, or v0.2.0-r2) publishes a release: the packages are built with that version and
# signed with the release key, the feed and the install script go to GitHub Pages (what routers install
# from and upgrade with), the same files are attached to a GitHub release.
# Needs once: the secret APK_SIGNING_KEY (the private ECDSA P-256 key, PEM) and Pages with
# "Source: GitHub Actions". A custom Pages address: the repository variable PAGES_URL.
# A mirror on your own server (optional, the job runs when MIRROR_URL is set): variables MIRROR_URL (the
# address routers use, https://feed.example.org/detour), MIRROR_TARGET (rsync over SSH: user@host:/var/www/detour,
# or user@host:. when the key is locked to that directory with rrsync - README), MIRROR_PORT (default 22); secrets
# MIRROR_SSH_KEY (a private key allowed on the server) and MIRROR_KNOWN_HOSTS (ssh-keyscan -p PORT host, checked
# against the server). The mirror's install.sh and page name the mirror; the packages, the index and the key are
# the same files as on Pages.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version from the tag
        id: ver
        run: |
          v=${GITHUB_REF_NAME#v}
          case "$v" in *-r[0-9]*) ;; *) v="$v-r1";; esac
          echo "$v" | grep -Eq '^[0-9]+(\.[0-9]+)*-r[0-9]+$' || { echo "::error::tag $GITHUB_REF_NAME is not v<x.y.z> or v<x.y.z>-r<n>"; exit 1; }
          sed -i "s/^version=.*/version=$v/" packages/detour/control packages/luci-app-detour/control
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          [ -n "$APK_SIGNING_KEY" ] || { echo "::error::the secret APK_SIGNING_KEY is not set"; exit 1; }
          mkdir -p "$RUNNER_TEMP/key"; chmod 700 "$RUNNER_TEMP/key"
          ( umask 077; printf '%s\n' "$APK_SIGNING_KEY" > "$RUNNER_TEMP/key/detour.key" )
          openssl ec -in "$RUNNER_TEMP/key/detour.key" -pubout -out "$RUNNER_TEMP/key/detour.pem"

      - name: Build the packages
        run: |
          docker run --rm -v "$PWD:/w" -v "$RUNNER_TEMP/key:/key" -w /w alpine:edge sh -euc '
            apk add -q build-base curl openssl
            KEY=/key/detour.key OUT=/w/out PKGS="detour luci-app-detour" sh tools/build-feed.sh'
          sudo chown -R "$(id -u):$(id -g)" out
          rm -rf "$RUNNER_TEMP/key"

      - name: The site (feed, key, install script, page)
        env:
          PAGES_URL: ${{ vars.PAGES_URL }}
          MIRROR_URL: ${{ vars.MIRROR_URL }}
        run: |
          # site <dir> <feed url>: the same packages, index and key; install.sh and the page name <feed url>
          site() {
            mkdir "$1"
            cp out/*.apk out/packages.adb "$1/"
            cp out/detour.pem "$1/detour.pem"
            sed "s#@FEED_URL@#$2#g" install.sh > "$1/install.sh"
            sed -e "s#@FEED_URL@#$2#g" -e "s#@VERSION@#${{ steps.ver.outputs.version }}#g" \
                -e "s#@REPO_URL@#$GITHUB_SERVER_URL/$GITHUB_REPOSITORY#g" tools/pages/index.html > "$1/index.html"
            ls -l "$1"
          }
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr 'A-Z' 'a-z')
          url=${PAGES_URL:-https://$owner.github.io/${GITHUB_REPOSITORY#*/}}
          site site "${url%/}"
          [ -z "$MIRROR_URL" ] || site mirror "${MIRROR_URL%/}"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site

      - uses: actions/upload-artifact@v4
        if: vars.MIRROR_URL != ''
        with:
          name: mirror
          path: mirror

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  # the same feed on your own server: the packages first, then the index and the rest, the old packages last -
  # a router never gets an index that names a package not there yet
  mirror:
    needs: [build, pages]
    if: vars.MIRROR_URL != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mirror
          path: mirror
      - name: Upload to the mirror
        env:
          MIRROR_TARGET: ${{ vars.MIRROR_TARGET }}
          MIRROR_PORT: ${{ vars.MIRROR_PORT }}
          MIRROR_SSH_KEY: ${{ secrets.MIRROR_SSH_KEY }}
          MIRROR_KNOWN_HOSTS: ${{ secrets.MIRROR_KNOWN_HOSTS }}
        run: |
          for v in MIRROR_TARGET MIRROR_SSH_KEY MIRROR_KNOWN_HOSTS; do
            eval "[ -n \"\$$v\" ]" || { echo "::error::$v is not set (needed with MIRROR_URL)"; exit 1; }
          done
          d="$RUNNER_TEMP/ssh"; mkdir -p "$d"; chmod 700 "$d"
          ( umask 077; printf '%s\n' "$MIRROR_SSH_KEY" > "$d/key"; printf '%s\n' "$MIRROR_KNOWN_HOSTS" > "$d/known_hosts" )
          ssh="ssh -p ${MIRROR_PORT:-22} -i $d/key -o IdentitiesOnly=yes -o UserKnownHostsFile=$d/known_hosts -o StrictHostKeyChecking=yes"
          rsync -rt --chmod=D755,F644 -e "$ssh" --include='*.apk' --exclude='*' mirror/ "$MIRROR_TARGET/"
          rsync -rt --chmod=D755,F644 -e "$ssh" --delete-after mirror/ "$MIRROR_TARGET/"
          rm -rf "$d"

  release:
    needs: [build, pages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" site/*.apk site/packages.adb site/detour.pem site/install.sh \
            --repo "$GITHUB_REPOSITORY" --title "Detour ${{ needs.build.outputs.version }}" --generate-notes
